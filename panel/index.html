<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Claude Usage</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main id="card" class="card">
    <header class="head">
      <h1>Plan usage</h1>
    </header>

    <p id="notice" class="notice" hidden></p>
    <section id="rows" class="rows" aria-live="polite"></section>

    <details id="settings" class="settings">
      <summary>Settings</summary>
      <label class="check"><input type="checkbox" id="alertsEnabled"> Alerts</label>
      <div class="thresholds">
        <span>Alert at</span>
        <input type="number" id="th0" min="1" max="100" step="1" aria-label="Lower alert threshold">
        <span>%</span>
        <span>and</span>
        <input type="number" id="th1" min="1" max="100" step="1" aria-label="Higher alert threshold">
        <span>%</span>
      </div>
      <label class="check"><input type="checkbox" id="showPercent"> Show percent in menu bar</label>
      <label class="check"><input type="checkbox" id="openAtLogin"> Start at login</label>
    </details>

    <footer class="foot">
      <span id="updated" class="updated"></span>
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="quit">Quit</button>
    </footer>
  </main>
  <script src="panel.js"></script>
</body>
</html>
